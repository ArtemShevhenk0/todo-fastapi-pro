<!doctype html>
<html lang="pl-PL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
    <div class="container" id="auth-section">
        <h5>Sign in</h5>
        <input type="text" name="user" id="user" value="">
        <input type="password" name="password" id="password" value="">
        <input type="submit" value="Sign in" onclick="login()">
        </div>
    <div class="container mt-3" id="main-section">
        <button class="btn btn-danger" onclick="logout()">Logout</button>
        <h5>Create Task</h5>
        <input type="text" name="title" id="title" value="" placeholder="Enter a task name">
        <input type="text" name="description" id="description" value="" placeholder="Enter a task description">
        <input type="file" class="form-control rounded-4 flex-grow-1" id="task-image" placeholder="IMAGE" >
          <label for="priority">Priority:</label>
          <select id="priority" name="priority">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
          </select>
        <input type="submit" value="Create Task" onclick="createTask()">
        <div id="task-list"></div>
    </div>
</body>

<script src="main.js"></script>
</html>
